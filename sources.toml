group = "blue_river"
title = "KCMO Public Works Projects"
url = "https://services.arcgis.com/4o5uMWTHuOhUVJPd/arcgis/rest/services/Blue_River_Projects_WFL1/FeatureServer/4"
fields = "OBJECTID,PROJECTID,PROJECTNAME,PROJECTSTATUS,CURRENTPHASE,PROJECTTYPE,PROJECTSCOPE,TOTALBUDGET,BUDGETSOURCE,DEPARTMENT,PROJECTSTARTDATE,PROJECTENDDATE,CONSTRUCTIONSTARTDATE,CONSTRUCTIONENDDATE,PROJECTLOCATION,COUNCILDISTRICT,PROJECTLINK"
