# --- Blue River (county Parkway Master Plan + KCMO restoration) -------------

[layers.br_watershed]
source = "marc"
group = "blue_river"
title = "Blue River Watershed"
url = "https://gis2.marc2.org/arcgis/rest/services/Environment/Watersheds/MapServer/0"
where = "Name = 'Blue River'"
color = "#08519c"

[layers.br_subwatersheds]
source = "usgs"
group = "blue_river"
title = "Sub-watersheds (HUC12)"
url = "https://hydro.nationalmap.gov/arcgis/rest/services/wbd/MapServer/6"
where = "huc12 LIKE '1030010101%'"
fields = "huc12,name,areaacres,states,tohuc"
color = "#6baed6"

[layers.br_river]
source = "marc"
group = "blue_river"
title = "Blue River"
url = "https://gis2.marc2.org/arcgis/rest/services/Environment/Streams/MapServer/0"
where = "StreamName IN ('Big Blue River', 'Old Big Blue River Channel')"
color = "#2171b5"

[layers.br_stream_health]
source = "marc"
group = "blue_river"
title = "Stream Health (2016)"
url = "https://gis2.marc2.org/arcgis/rest/services/Environment/StreamHealth/MapServer/0"
clip = "br_watershed"
color = "#41ab5d"

[layers.br_gauges]
source = "usgs"
group = "blue_river"
kind = "usgs_gauges"
title = "USGS Stream Gauges (latest reading)"
url = "https://api.waterdata.usgs.gov/ogcapi/v1/collections"
clip = "br_watershed"
color = "#e31a1c"

[layers.br_parkway]
source = "marc"
group = "blue_river"
title = "Blue River Parkway (county park)"
url = "https://gis2.marc2.org/arcgis/rest/services/Environment/Parks/MapServer/0"
where = "Name = 'Blue River Parkway' AND AgencyName = 'Jackson County'"
color = "#238b45"

[layers.br_parkway_trails]
source = "marc"
group = "blue_river"
title = "Parkway & Blue River Trails"
url = "https://gis2.marc2.org/arcgis/rest/services/Recreation/Trails_and_Bikeways/MapServer/0"
where = "State = 'MO' AND (ParkName = 'Blue River Parkway' OR RouteName LIKE '%Blue River%')"
color = "#8c510a"

# Trail network mapped by OSM volunteers, including the parkway's singletrack mountain-bike trails.
# Excludes sidewalks, crossings and private paths. Each feature keeps its last editor and that edit's sources.
[layers.br_osm_trails]
source = "osm"
group = "blue_river"
kind = "osm"
title = "Trails & Singletrack (OpenStreetMap)"
url = "https://overpass-api.de/api/interpreter"
where = '["highway"~"^(path|track|bridleway|cycleway|footway)$"]["footway"!~"sidewalk|crossing"]["access"!~"^(private|no)$"]'
clip = "br_parkway"
color = "#d95f02"

[layers.br_greenway]
source = "marc"
group = "blue_river"
title = "Blue River Greenway (MetroGreen, existing + planned)"
url = "https://gis2.marc2.org/arcgis/rest/services/Recreation/Metrogreen_Corridors/MapServer/0"
where = "Name IN ('Big Blue River Grnwy', 'Blue River Grnwy')"
color = "#dfc27d"

[layers.br_restoration_areas]
source = "kcmo"
group = "blue_river"
title = "KCMO ARPA Restoration Areas"
url = "https://services.arcgis.com/4o5uMWTHuOhUVJPd/arcgis/rest/services/Blue_River_ARPA_Restoration_Areas/FeatureServer/1"
fields = "OBJECTID,Name"
color = "#ff7f00"

[layers.br_corridor_buffer]
source = "kcmo"
group = "blue_river"
title = "KCMO Blue River ½-mile Corridor"
url = "https://services.arcgis.com/4o5uMWTHuOhUVJPd/arcgis/rest/services/Blue_River_Projects_WFL1/FeatureServer/3"
color = "#9ecae1"

[layers.br_kcmo_trail]
source = "kcmo"
group = "blue_river"
title = "KCMO Blue River Trail"
url = "https://services.arcgis.com/4o5uMWTHuOhUVJPd/arcgis/rest/services/Blue_River_Projects_WFL1/FeatureServer/2"
color = "#a6611a"

[layers.br_brownfields]
source = "kcmo"
group = "blue_river"
title = "KCMO Brownfields"
url = "https://services.arcgis.com/4o5uMWTHuOhUVJPd/arcgis/rest/services/Blue_River_Projects_WFL1/FeatureServer/0"
color = "#67000d"

# Capital projects; contact name/email/phone fields left out.
[layers.br_cip_public_works]
