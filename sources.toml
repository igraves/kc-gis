# Registry of GIS layers to pull for Jackson County, MO.
#
# Each [layers.<name>] entry:
#   url    ArcGIS REST layer URL (…/MapServer/<id> or …/FeatureServer/<id>)
#   source "jackson" or "marc" (keys into [servers])
#   title  display name
#   where  optional SQL filter applied server-side (default "1=1")
#   clip   true to keep only features intersecting the county boundary
#   large  true to skip in `kcgis fetch` unless named explicitly
#   simplify  optional server-side generalization tolerance in degrees (0.00005 ≈ 5 m)
#   fields comma-separated outFields (default "*"); use it to leave out personal data
#   clip   may also name another polygon layer to clip to, e.g. clip = "br_watershed"
#   group  key into [groups] to show the layer under a themed heading in the viewer
#   kind   "arcgis" (default) or "usgs_gauges" (active USGS gauges inside the `clip` layer, latest readings)
#   color  hex color used by the web viewer and static maps
#
# Discover more layers with: kcgis catalog jackson | kcgis catalog marc

[county]
name = "Jackson County, MO"
fips = "29095"
# Layer whose geometry is used for `clip = true`
boundary_layer = "county_boundary"

[servers.jackson]
title = "Jackson County, MO GIS"
root = "https://jcgis.jacksongov.org/arcgis/rest/services"
homepage = "https://www.jacksongov.org/Government/Departments/Geographic-Information-Systems"

[servers.marc]
title = "Mid-America Regional Council (MARC)"
root = "https://gis2.marc2.org/arcgis/rest/services"
homepage = "https://www.marc.org/data-and-maps"

[servers.kcmo]
title = "City of Kansas City, MO"
root = "https://services.arcgis.com/4o5uMWTHuOhUVJPd/arcgis/rest/services"
homepage = "https://kcmo.maps.arcgis.com"

[servers.osm]
title = "OpenStreetMap contributors (ODbL)"
root = "https://overpass-api.de/api/interpreter"
homepage = "https://www.openstreetmap.org/copyright"

[servers.usgs]
title = "U.S. Geological Survey"
root = "https://hydro.nationalmap.gov/arcgis/rest/services"
homepage = "https://waterdata.usgs.gov"

# --- Themed groups ----------------------------------------------------------

[groups.blue_river]
title = "Blue River"
description = "Jackson County's Blue River Parkway Master Plan (adopted Dec 5, 2022) and Kansas City's Blue River restoration and capital projects."
zoom_layer = "br_watershed"
documents = [
  { title = "Blue River Parkway Master Plan (Jackson County, 2022)", url = "https://www.makeyourdayhere.com/files/assets/parksrec/v/1/parks/documents/jcpr_brp_masterplan.pdf" },
  { title = "Master Plan appendices", url = "https://www.makeyourdayhere.com/files/assets/parksrec/v/1/parks/documents/jcpr_brp_masterplan-appendix-sm-file-size.pdf" },
  { title = "Resolution 21107 adopting the plan", url = "https://www.makeyourdayhere.com/files/assets/parksrec/v/1/i-want-to/documents/blue-river-parkway-master-plan-resolution-21107_adopted-dec-5-2022.pdf" },
  { title = "Blue River Parkway map (2022)", url = "https://www.makeyourdayhere.com/files/assets/parksrec/v/1/facilities/documents/blue-river-parkway-map-2022.pdf" },
  { title = "Master planning page", url = "https://www.makeyourdayhere.com/Home/Featured-Content-2/Blue-River-Parkway-Master-Planning" },
  { title = "KCMO Blue River Projects map", url = "https://experience.arcgis.com/experience/da4be96b50014965aeab1fe1406cc18e" },
  { title = "KCMO Blue River Greenway StoryMap", url = "https://storymaps.arcgis.com/stories/46f956c41a234b6bad598a56417899e4" },
]

